<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Botequim na Mão - Carrinho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/estilos.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

  <!-- HEADER -->
  <header class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm sticky-top">
    <div class="container">
      <a href="index.html" class="navbar-brand d-flex align-items-center gap-2">
        <img src="./images/geral/header/logo_botequim_na_mao_1.png" alt="Logo" width="50" class="rounded-circle">
        <div class="d-none d-sm-block">
          <h1 class="h5 mb-0 text-primary fw-bold" style="color: #6a1b9a !important;">Botequim na Mão</h1>
          <p class="small text-muted mb-0">Seu cardápio inteligente</p>
        </div>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <div class="nav d-flex flex-row flex-nowrap align-items-center justify-content-center gap-2 mt-3 mt-lg-0">
          <a href="index.html" class="btn btn-outline-primary fw-bold flex-shrink-0"
            style="color: #6a1b9a; border-color: #6a1b9a;">Home</a>
          <a href="cardapio.html" class="btn btn-outline-primary fw-bold flex-shrink-0"
            style="color: #6a1b9a; border-color: #6a1b9a;">Cardápio</a>
          <a href="sobre.html" class="btn btn-outline-primary fw-bold flex-shrink-0"
            style="color: #6a1b9a; border-color: #6a1b9a;">O Botequim</a>
          <a href="login.html" class="btn btn-primary fw-bold flex-shrink-0"
            style="background-color: #6a1b9a; border-color: #6a1b9a;">Login</a>
        </div>
      </div>
    </div>
  </header>

  <main id="page-carrinho" class="container py-5 flex-grow-1">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 fw-bold mb-0" style="color: #6a1b9a;">Seu Carrinho</h1>
      <a href="cardapio.html" class="btn btn-outline-secondary btn-sm rounded-pill fw-bold">Continuar Comprando</a>
    </div>

    <div id="cart-container" class="bg-white shadow-sm border rounded-4 p-4 p-md-5 min-vh-50 text-center">
      <div class="spinner-border text-primary" role="status" style="color: #6a1b9a !important;">
        <span class="visually-hidden">Carregando...</span>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white py-4 border-top text-center mt-auto">
    <div class="container">
      <img src="./images/geral/header/logo_botequim_na_mao_1.png" alt="Logo" width="48" class="mb-3">
      <p class="text-muted mb-2">
        &copy; 2026 Botequim na Mão. Todos os direitos reservados.<br>
        Desenvolvido por Samuel R. P. Cunha
      </p>
    </div>
  </footer>

  <script type="module" src="./js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
