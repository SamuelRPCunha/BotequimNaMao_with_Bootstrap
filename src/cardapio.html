<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Botequim na Mão - Cardápio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/estilos.css">
</head>

<body class="bg-light">

  <!-- HEADER -->
  <header class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm sticky-top">
    <div class="container">
      <a href="index.html" class="navbar-brand d-flex align-items-center gap-2">
        <img src="./images/geral/header/logo_botequim_na_mao_1.png" alt="Logo" width="50" class="rounded-circle">
        <div class="d-none d-sm-block">
          <h1 class="h5 mb-0 text-primary fw-bold" style="color: #6a1b9a !important;">Botequim na Mão</h1>
          <p class="small text-muted mb-0">Seu cardápio inteligente</p>
        </div>
      </a>

      <!-- Barra de Pesquisa Integrada no Header -->
      <div class="d-flex flex-grow-1 mx-3 justify-content-center order-lg-0 order-last mt-3 mt-lg-0 w-100 w-lg-auto">
        <div class="input-group" style="max-width: 500px;">
          <input type="text" id="input-busca" class="form-control rounded-pill border-end-0"
            placeholder="Pesquisar drink...">
          <button id="btn-toggle-filtro"
            class="btn btn-outline-secondary rounded-pill border-start-0 bg-transparent ms-n3" type="button"
            style="color: #6a1b9a; border-color: #ced4da;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path>
            </svg>
          </button>
        </div>
      </div>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <div class="nav d-flex flex-row flex-nowrap align-items-center justify-content-center gap-2 mt-3 mt-lg-0">
          <!-- Acessibilidade -->
          <button class="btn btn-link text-secondary p-1 text-decoration-none fw-bold fs-5 btn-increase-font" title="Tamanho da Fonte" aria-label="Tamanho da Fonte">Aa</button>
          <button class="btn btn-link text-secondary p-1 btn-toggle-theme" title="Alternar Tema Escuro" aria-label="Alternar Tema">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <a href="index.html" class="btn btn-outline-primary fw-bold flex-shrink-0"
            style="color: #6a1b9a; border-color: #6a1b9a;">Home</a>
          <a href="sobre.html" class="btn btn-outline-primary fw-bold flex-shrink-0"
            style="color: #6a1b9a; border-color: #6a1b9a;">O Botequim</a>
          <a href="login.html" class="btn btn-primary fw-bold flex-shrink-0"
            style="background-color: #6a1b9a; border-color: #6a1b9a;">Login</a>
        </div>
      </div>
    </div>
  </header>

  <div id="page-cardapio">
    <!-- ÁREA DE FILTROS -->
    <div id="area-filtro" class="collapse bg-white border-bottom py-4 shadow-sm">
      <div class="container">
        <h3 class="h5 fw-bold">Filtrar por ingredientes</h3>
        <p class="text-muted small mb-3">Selecione os ingredientes que você deseja na sua bebida:</p>
        <div id="lista-ingredientes" class="d-flex flex-wrap gap-2 mb-3"></div>
        <button id="btn-limpar-filtros" class="btn btn-link text-decoration-none text-muted p-0">Limpar filtros</button>
      </div>
    </div>

    <main class="container py-5">
      <div id="cards-container" class="row g-4"></div>
    </main>
  </div>

  <script type="module" src="./js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
