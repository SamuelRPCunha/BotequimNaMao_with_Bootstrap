<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Botequim na Mão - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/estilos.css">
</head>

<body class="bg-light">
  <div id="page-login" class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <!-- MODAL -->
    <div id="modal" class="modal fade" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center p-4">
          <p id="modal-msg" class="mb-4 lead"></p>
          <button id="modal-btn" class="btn btn-primary px-4 py-2 mx-auto"
            style="background-color: #6a1b9a; border-color: #6a1b9a; width: fit-content;"
            data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 rounded-4 w-100" style="max-width: 400px;">
      <div class="card-body p-4 p-md-5 position-relative">
        <button onclick="window.history.back()"
          class="btn rounded-circle shadow-sm position-absolute d-flex align-items-center justify-content-center p-0 hover-opacity"
          style="width: 40px; height: 40px; top: 1.5rem; left: 1.5rem; color: #6a1b9a; background-color: #f6f2f7; border: 1px solid #e6d1ea;"
          title="Voltar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <path d="M12 19L5 12L12 5"></path>
          </svg>
        </button>
        <div class="text-center mb-4 mt-1">
          <img src="./images/geral/header/logo_botequim_na_mao_1.png" alt="Logo" width="60"
            class="rounded-circle shadow-sm">
        </div>

        <h2 id="login-title" class="h4 fw-bold text-center mb-1">Acesse sua conta</h2>
        <p id="login-subtitle" class="text-muted text-center small mb-4">Bem-vindo de volta! Por favor, insira seus
          dados.</p>

        <form id="form-login">
          <div class="mb-3" id="group-name" style="display: none;">
            <label class="form-label text-muted small fw-bold">Nome completo</label>
            <input type="text" id="input-name" class="form-control p-2" placeholder="Ex: Samuel Cunha">
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small fw-bold">E-mail</label>
            <input type="text" id="input-email" class="form-control p-2" placeholder="exemplo@email.com" required>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted small fw-bold">Senha</label>
            <input type="password" id="input-password" class="form-control p-2" placeholder="********" required>
          </div>

          <button type="submit" id="btn-submit" class="btn btn-primary w-100 py-2 fw-bold"
            style="background-color: #6a1b9a; border-color: #6a1b9a;">Entrar</button>
        </form>

        <div class="text-center mt-4">
          <p class="small text-muted mb-0">
            <span id="toggle-text">Não tem uma conta?</span>
            <button id="toggle-btn" class="btn btn-link text-decoration-none fw-bold p-0"
              style="color: #6a1b9a;">Cadastre-se</button>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
